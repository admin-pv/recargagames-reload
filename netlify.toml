[build]
  publish   = "public"
  functions = "netlify/functions"

# publish = "public" (e não "." como no offerwall) de propósito: só o que
# está em public/ vai pro ar. Assim migrations/*.sql, forms-map.json e lib/
# ficam FORA do bundle público — nada de servir o mapa de formulários nem o
# schema do banco em URL adivinhável. É também o que torna a checagem de
# secrets no bundle ("grep em public/") uma prova de verdade.
#
# Sem build step. Site é HTML/CSS/JS estático servido de public/; as functions
# são ESM puro (Functions API v2) e declaram o próprio path via
# `export const config = { path: "/api/..." }` dentro de cada arquivo.
# Não há [[redirects]] pra /api/* — a rota vem do config da function.
# Manter em mente ao renomear arquivo/rota: a verdade está no .mjs.

[functions]
  node_bundler = "esbuild"

# Headers de segurança. App público, estático, sem iframe, sem terceiros
# além do Google Fonts (fonte display da identidade).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "interest-cohort=(), geolocation=(), camera=(), microphone=()"
    # CSP: script só de 'self' (por isso o JS vive em app.js, não inline).
    # style-src precisa de 'unsafe-inline' apenas porque o Google Fonts
    # injeta @font-face via stylesheet própria — o CSS do app é arquivo.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"

# Nada aqui pode ser cacheado por engano: as telas mostram estado de
# voucher. O HTML fica sem cache; as functions já mandam no-store.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"
